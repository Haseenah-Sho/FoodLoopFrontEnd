<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — FoodLoop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <div class="dashboard-container">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <a href="index.html" class="sidebar-logo">Food<span>Loop</span></a>
                <button class="sidebar-close" id="sidebarClose">
                    <i class="bi bi-x"></i>
                </button>
            </div>

            <div class="sidebar-user">
                <div class="sidebar-user-info">
                    <div class="sidebar-username" id="sidebar-username">Loading...</div>
                    <div class="sidebar-role">Customer</div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="customer-dashboard.html" class="sidebar-link active">Dashboard</a>
                <a href="index.html" class="sidebar-link">Browse Food</a>
                <a href="my-orders.html" class="sidebar-link">My Orders</a>
                <a href="my-payments.html" class="sidebar-link">My Payments</a>
                <a href="notifications.html" class="sidebar-link">Notifications
                    <!-- <span class="notif-badge" id="notif-badge" style="display:none;"></span> -->
                </a>
            </nav>

            <div class="sidebar-bottom">
                <button class="sidebar-logout" onclick="Auth.logout()">Logout</button>
            </div>
        </aside>

        <!-- OVERLAY for mobile -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- MAIN CONTENT -->
        <div class="dashboard-main">

            <!-- Top bar -->
            <header class="topbar">
                <button class="topbar-toggle" id="sidebarToggle">
                    <i class="bi bi-list"></i>
                </button>
                <div class="topbar-title" id="topbar-title">Dashboard</div>
                <div class="topbar-right">
                    <span class="topbar-greeting" id="topbar-greeting"></span>
                </div>
            </header>

            <!-- Page content -->
            <main class="dashboard-content">

                <!-- Stats row -->
                <div class="stats-row">
                    <div class="stat-card">
                        <div class="stat-info">
                            <div class="stat-value" id="stat-total-orders">—</div>
                            <div class="stat-label">Total Orders</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-info">
                            <div class="stat-value" id="stat-active-orders">—</div>
                            <div class="stat-label">Active Orders</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-info">
                            <div class="stat-value" id="stat-total-spent">—</div>
                            <div class="stat-label">Total Spent</div>
                        </div>
                    </div>
                </div>

                <!-- Quick action -->
                <div class="quick-action">
                    <div class="quick-action-text">
                        <h3>Hungry? Find surplus food near you</h3>
                        <p>Browse active listings and grab a meal before it runs out.</p>
                    </div>
                    <a href="index.html#listings" class="btn-primary-sm">Browse Food</a>
                </div>

                <!-- Recent orders -->
                <div class="section">
                    <div class="section-top">
                        <h2>Recent Orders</h2>
                        <a href="my-orders.html" class="section-link">View all</a>
                    </div>
                    <div id="recent-orders">
                        
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="utils.js"></script>
    <script src="api.js"></script>
    <script src="signalr.js"></script>
    <script src="customer-dashboard.js"></script>
</body>
</html>
