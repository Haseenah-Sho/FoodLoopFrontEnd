<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register as Vendor - FoodLoop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-bg">
        <div class="auth-card">

            <a href="index.html" class="auth-logo">Food<span>Loop</span></a>

            <h1>Sell / Give Away Food</h1>
            <p class="auth-subtitle">Register as a vendor or household and start listing your surplus food</p>

            <div class="form-error" id="form-error"></div>

            <form id="register-form" novalidate>

                <div class="form-group">
                    <label for="fullNameInput">Full Name</label>
                    <input type="text" id="fullNameInput" class="form-input" placeholder="Enter your full name">
                    <div class="field-error" id="fullname-error"></div>
                </div>

                <div class="form-group">
                    <label for="orgNameInput">Organization / Household Name</label>
                    <input type="text" id="orgNameInput" class="form-input">
                    <div class="field-error" id="orgname-error"></div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="phoneInput">Phone Number</label>
                        <input type="tel" id="phoneInput" class="form-input" placeholder="e.g. 08012345678">
                        <div class="field-error" id="phone-error"></div>
                    </div>
                    <div class="form-group">
                        <label for="emailInput">Email Address</label>
                        <input type="email" id="emailInput" class="form-input" placeholder="johndoe@gmail.com">
                        <div class="field-error" id="email-error"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="passwordInput">Password</label>
                    <div class="input-wrap">
                        <input type="password" id="passwordInput" class="form-input" placeholder="Min. 8 characters">
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="bi bi-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                    <div class="field-error" id="password-error"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPasswordInput">Confirm Password</label>
                    <div class="input-wrap">
                        <input type="password" id="confirmPasswordInput" class="form-input" placeholder="Confirm password">
                        <button type="button" class="toggle-password" id="toggleConfirm">
                            <i class="bi bi-eye" id="toggleConfirmIcon"></i>
                        </button>
                    </div>
                    <div class="field-error" id="confirm-error"></div>
                </div>

                <div class="info-note">
                    Your account will be reviewed and approved by the admin team before you can start listing food.
                </div>

                <button type="submit" class="btn-submit" id="register-btn">
                    <span id="btn-text">Submit Registration</span>
                    <span class="spinner" id="btn-spinner"></span>
                </button>

            </form>

            <div class="auth-divider"><span>Already have an account?</span></div>
            <a href="login.html" class="btn-outline">Sign In</a>

        </div>
    </div>

    <script src="utils.js"></script>
    <script src="api.js"></script>
    <script src="register-vendor.js"></script>
</body>
</html>
