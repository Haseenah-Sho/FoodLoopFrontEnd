<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Detail - FoodLoop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="order-detail.css">
</head>
<body>

    <div class="dashboard-container">

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <a href="index.html" class="sidebar-logo">Food<span>Loop</span></a>
                <button class="sidebar-close" id="sidebarClose">
                    <i class="bi bi-x"></i>
                </button>
            </div>
            <div class="sidebar-user">
                <div class="sidebar-user-info">
                    <div class="sidebar-username" id="sidebar-username">Loading...</div>
                    <div class="sidebar-role">Customer</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="customer-dashboard.html" class="sidebar-link">Dashboard</a>
                <a href="index.html" class="sidebar-link">Browse Food</a>
                <a href="my-orders.html" class="sidebar-link active">My Orders</a>
                <a href="notifications.html" class="sidebar-link">Notifications</a>
                <a href="customer-profile.html" class="sidebar-link">Profile</a>
            </nav>
            <div class="sidebar-bottom">
                <button class="sidebar-logout" onclick="Auth.logout()">Logout</button>
            </div>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <div class="dashboard-main">
            <header class="topbar">
                <button class="topbar-toggle" id="sidebarToggle">
                    <i class="bi bi-list"></i>
                </button>
                <div class="topbar-title">Order Detail</div>
                <div class="topbar-right">
                    <div class="topbar-actions">
                        <a href="checkout.html" class="topbar-cart-btn" aria-label="Cart">
                            <i class="bi bi-cart3"></i>
                            <span class="topbar-badge" id="cart-badge" style="display:none;"></span>
                        </a>
                        <div class="notif-bell-wrap">
                            <button class="topbar-bell-btn" id="notifBellBtn" aria-label="Notifications">
                                <i class="bi bi-bell"></i>
                                <span class="topbar-badge" id="notifBadge" style="display:none;"></span>
                            </button>
                            <div class="notif-dropdown" id="notifDropdown">
                                <div class="notif-dropdown-head">
                                    <span>Notifications</span>
                                    <button class="notif-mark-read-btn" id="notifMarkReadBtn">Mark all read</button>
                                </div>
                                <div id="notifList"><div class="notif-empty">Loading...</div></div>
                            </div>
                        </div>
                    
                </div>
                    <a href="my-orders.html" class="btn-primary-sm" style="background:transparent;color:var(--dark-muted);border:1.5px solid var(--border);">
                        <i class="bi bi-arrow-left"></i> Back
                    </a>
                </div>
            </header>

            <main class="dashboard-content">

                <!-- Loading -->
                <div class="form-card" id="detail-loading">
                    
                </div>

                <!-- Error -->
                <div class="empty-state" id="detail-error" style="display:none;">
                    <p>Order not found. <a href="my-orders.html">Back to My Orders</a></p>
                </div>

                <!-- Content -->
                <div id="detail-content" style="display:none;">

                    <div class="order-detail-card">

                        <div class="order-detail-header">
                            <div>
                                <div class="order-detail-no" id="od-orderNo"></div>
                                <div class="order-detail-date" id="od-date"></div>
                            </div>
                            <span id="od-status"></span>
                        </div>

                        <div class="order-detail-vendor">
                            <i class="bi bi-shop"></i>
                            <div>
                                <div class="od-vendor-name" id="od-vendorName"></div>
                                <div class="od-vendor-phone" id="od-vendorPhone"></div>
                            </div>
                        </div>

                        <div class="order-detail-section-title">Items</div>
                        <div class="order-detail-items" id="od-items"></div>

                        <div class="order-detail-meta-row">
                            <div class="od-meta">
                                <span class="od-meta-label">Fulfilment</span>
                                <span id="od-fulfilment"></span>
                            </div>
                            <div class="od-meta" id="od-address-wrap" style="display:none;">
                                <span class="od-meta-label">Delivery Address</span>
                                <span id="od-address"></span>
                            </div>
                        </div>

                        <div class="order-detail-total-row">
                            <span>Total</span>
                            <span id="od-total"></span>
                        </div>

                        <div id="od-actions" class="order-detail-actions" style="display:none;">
                            <button id="od-pay-btn" class="btn-primary-sm" style="display:none;">
                                <i class="bi bi-credit-card"></i> Pay Now
                            </button>
                            <button id="od-edit-btn" class="btn-edit-order" style="display:none;">
                                <i class="bi bi-pencil"></i> Edit Order
                            </button>
                            <button id="od-cancel-btn" class="btn-cancel-order" style="display:none;">
                                <i class="bi bi-x-circle"></i> Cancel Order
                            </button>
                        </div>

                    </div>

                </div>

            </main>
        </div>
    </div>

    <script src="utils.js"></script>
    <script src="api.js"></script>
    <script src="cart.js"></script>
    <script src="signalr.js"></script>
    <script src="notif-bell.js"></script>
    <script src="order-detail.js"></script>
</body>
</html>
