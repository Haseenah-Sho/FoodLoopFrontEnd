<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - FoodLoop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-bg">
        <div class="auth-card">

            <a href="index.html" class="auth-logo">Food<span>Loop</span></a>


            <h1>Forgot Password?</h1>
            <p class="auth-subtitle">Enter your email address and we'll send you a code to reset your password.</p>

            <div class="form-error" id="form-error"></div>
            <div class="form-success" id="form-success"></div>

            <form id="forgot-form" novalidate>

                <div class="form-group">
                    <label for="emailInput">Email Address</label>
                    <input type="email" id="emailInput" class="form-input" placeholder="Enter your email">
                    <div class="field-error" id="email-error"></div>
                </div>

                <button type="submit" class="btn-submit" id="forgot-btn">
                    <span id="btn-text">Send Reset Code</span>
                    <span class="spinner" id="btn-spinner"></span>
                </button>

            </form>

            <div class="auth-divider"><span></span></div>
            <a href="login.html" class="btn-outline">Cancel</a>

        </div>
    </div>

    <script src="utils.js"></script>
    <script src="api.js"></script>
    <script src="forgot-password.js"></script>
</body>
</html>
