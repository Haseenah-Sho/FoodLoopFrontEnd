<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - FoodLoop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-bg">
        <div class="auth-card">

            <a href="index.html" class="auth-logo">Food<span>Loop</span></a>


            <h1>Reset Password</h1>
            <p class="auth-subtitle">Enter the code sent to your email and choose a new password.</p>

            <div class="form-error" id="form-error"></div>
            <div class="form-success" id="form-success"></div>

            <form id="reset-form" novalidate>

                <div class="form-group">
                    <label for="emailInput">Email Address</label>
                    <input type="email" id="emailInput" class="form-input" placeholder="Enter your email">
                    <div class="field-error" id="email-error"></div>
                </div>

                <div class="form-group">
                    <label for="tokenInput">Reset Code</label>
                    <input
                        type="text"
                        id="tokenInput"
                        class="form-input token-input"
                        placeholder="Enter reset code"
                        maxlength="6"
                        inputmode="numeric"
                    >
                    <div class="field-error" id="token-error"></div>
                </div>

                <div class="form-group">
                    <label for="passwordInput">New Password</label>
                    <div class="input-wrap">
                        <input type="password" id="passwordInput" class="form-input" placeholder="Min. 8 characters">
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="bi bi-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                    <div class="field-error" id="password-error"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPasswordInput">Confirm New Password</label>
                    <div class="input-wrap">
                        <input type="password" id="confirmPasswordInput" class="form-input" placeholder="Confirm password">
                        <button type="button" class="toggle-password" id="toggleConfirm">
                            <i class="bi bi-eye" id="toggleConfirmIcon"></i>
                        </button>
                    </div>
                    <div class="field-error" id="confirm-error"></div>
                </div>

                <button type="submit" class="btn-submit" id="reset-btn">
                    <span id="btn-text">Reset Password</span>
                    <span class="spinner" id="btn-spinner"></span>
                </button>

            </form>

            <div class="auth-divider"><span>Remember your password?</span></div>
            <a href="login.html" class="btn-outline">Back to Login</a>

        </div>
    </div>

    <script src="utils.js"></script>
    <script src="api.js"></script>
    <script src="reset-password.js"></script>
</body>
</html>
