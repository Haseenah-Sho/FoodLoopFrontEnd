<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Food Item - FoodLoop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="disclaimer.css">
</head>
<body>

    <div class="dashboard-container">

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <a href="index.html" class="sidebar-logo">Food<span>Loop</span></a>
                <button class="sidebar-close" id="sidebarClose"><i class="bi bi-x"></i></button>
            </div>
            <div class="sidebar-user">
                <div class="sidebar-user-info">
                    <div class="sidebar-username" id="sidebar-username">Loading...</div>
                    <div class="sidebar-role">Food Providers</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="food-providers-dashboard.html" class="sidebar-link">Dashboard</a>
                <a href="my-food-items.html" class="sidebar-link active">My Food Items</a>
                <a href="post-food-items.html" class="sidebar-link">Post Food Items</a>
                <a href="food-providers-orders.html" class="sidebar-link">Orders</a>
                <a href="food-providers-transactions.html" class="sidebar-link">Transactions</a>
                <a href="food-providers-profile.html" class="sidebar-link">Profile</a>
            </nav>
            <div class="sidebar-bottom">
                <button class="sidebar-logout" onclick="Auth.logout()">Logout</button>
            </div>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <div class="dashboard-main">
            <div class="dashboard-sticky-top">
                <div class="disclaimer-bar" role="note">
                    <i class="bi bi-info-circle"></i>
                    <span>
                        Food is posted by independent providers. FoodLoop is not responsible
                        for the food or any dispute between a provider and a customer.
                        <a href="disclaimer.html">Read more</a>
                    </span>
                </div>
                <header class="topbar">
                    <button class="topbar-toggle" id="sidebarToggle"><i class="bi bi-list"></i></button>
                    <div class="topbar-title">Review Food Item</div>
                </header>
            </div>

            <main class="dashboard-content">

                <a href="my-food-items.html" class="back-to-list">
                    <i class="bi bi-arrow-left"></i> Back to My Food Items
                </a>
                <div class="form-error-banner" id="review-error" style="display:none; max-width:860px;"></div>

                <div class="review-banner" id="review-banner" style="display:none;">
                    <i class="bi bi-eye-slash"></i>
                    <div id="review-banner-text"></div>
                </div>

                <div class="review-card" id="review-card" style="display:none;"></div>

                <div class="review-actions" id="review-actions" style="display:none;">
                    <button class="btn-row primary" id="publish-btn">Publish</button>
                    <a class="btn-row" id="edit-btn" href="#">Edit</a>
                    <button class="btn-row danger" id="discard-btn">Discard</button>
                </div>

            </main>
        </div>
    </div>

    <script src="utils.js"></script>
    <script src="api.js"></script>
    <script src="signalr.js"></script>
    <script src="review-listing.js"></script>
</body>
</html>
