<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FoodLoop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-bg">

        <div class="auth-card">

            <a href="index.html" class="auth-logo">
                Food<span>Loop</span>
            </a>

            <h1>Welcome back</h1>
            <p class="auth-subtitle">Sign in to your FoodLoop account</p>

            <div class="form-error" id="form-error"></div>

            <form id="login-form" novalidate>

                <div class="form-group">
                    <label for="emailInput">Email address</label>
                    <input
                        type="email"
                        id="emailInput"
                        class="form-input"
                        placeholder="Enter your email"
                    >
                    <div class="field-error" id="email-error"></div>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="passwordInput">Password</label>
                        <a href="forgot-password.html" class="forgot-link">
                            Forgot password?
                        </a>
                    </div>
                    <div class="input-wrap">
                        <input
                            type="password"
                            id="passwordInput"
                            class="form-input"
                            placeholder="Enter your password"
                        >
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="bi bi-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                    <div class="field-error" id="password-error"></div>
                </div>

                <button type="submit" class="btn-submit" id="login-btn">
                    <span id="btn-text">Sign In</span>
                    <span class="spinner" id="btn-spinner"></span>
                </button>

            </form>

            <div class="auth-divider">
                <span>Don't have an account?</span>
            </div>

            <a href="register-customer.html" class="btn-outline">
                Register as Customer
            </a>
            <a href="register-vendor.html" class="btn-outline dark">
                Register as a Food Provider
            </a>

        </div>

    </div>

    <script src="utils.js"></script>
    <script src="api.js"></script>
    <script src="login.js"></script>
</body>
</html>
