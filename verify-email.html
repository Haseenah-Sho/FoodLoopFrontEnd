<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - FoodLoop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-bg">
        <div class="auth-card">

            <a href="index.html" class="auth-logo">Food<span>Loop</span></a>


            <h1>Check Your Email</h1>
            <p class="auth-subtitle">We sent a 6-digit verification code to your email address. Enter it below to verify your account.</p>

            <div class="form-error" id="form-error"></div>
            <div class="form-success" id="form-success"></div>

            <form id="verify-form" novalidate>

                <div class="form-group">
                    <label for="emailInput">Email Address</label>
                    <input type="email" id="emailInput" class="form-input" placeholder="Enter your email">
                    <div class="field-error" id="email-error"></div>
                </div>

                <div class="form-group">
                    <label for="tokenInput">Verification Code</label>
                    <input
                        type="text"
                        id="tokenInput"
                        class="form-input token-input"
                        placeholder="Enter 6-digit code"
                        maxlength="6"
                        inputmode="numeric"
                    >
                    <div class="field-error" id="token-error"></div>
                </div>

                <button type="submit" class="btn-submit" id="verify-btn">
                    <span id="btn-text">Verify Email</span>
                    <span class="spinner" id="btn-spinner"></span>
                </button>

            </form>

            <div class="auth-divider"><span>Didn't receive a code?</span></div>
            <a href="resend-token.html" class="btn-outline">Resend Verification Code</a>

        </div>
    </div>

    <script src="utils.js"></script>
    <script src="api.js"></script>
    <script src="verify-email.js"></script>
</body>
</html>
