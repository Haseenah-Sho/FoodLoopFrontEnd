<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Food Items - FoodLoop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <div class="dashboard-container">

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <a href="index.html" class="sidebar-logo">Food<span>Loop</span></a>
                <button class="sidebar-close" id="sidebarClose">
                    <i class="bi bi-x"></i>
                </button>
            </div>
            <div class="sidebar-user">
                <div class="sidebar-user-info">
                    <div class="sidebar-username" id="sidebar-username">Loading...</div>
                    <div class="sidebar-role">Food Providers</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="food-providers-dashboard.html" class="sidebar-link">Dashboard</a>
                <a href="my-food-items.html" class="sidebar-link">My Food Items</a>
                <a href="post-food-items.html" class="sidebar-link active">Post Food Items</a>
                <a href="food-providers-orders.html" class="sidebar-link">Orders</a>
                <a href="food-providers-transactions.html" class="sidebar-link">Transactions</a>
                <a href="food-providers-profile.html" class="sidebar-link">Profile</a>
            </nav>
            <div class="sidebar-bottom">
                <button class="sidebar-logout" onclick="Auth.logout()">Logout</button>
            </div>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <div class="dashboard-main">
            <header class="topbar">
                <button class="topbar-toggle" id="sidebarToggle">
                    <i class="bi bi-list"></i>
                </button>
                <div class="topbar-title">Post Food Items</div>
                <div class="topbar-right">
                    <div class="notif-bell-wrap">
                        <button class="topbar-bell-btn" id="notifBellBtn" aria-label="Notifications">
                            <i class="bi bi-bell"></i>
                            <span class="topbar-badge" id="notifBadge" style="display:none;"></span>
                        </button>
                        <div class="notif-dropdown" id="notifDropdown">
                            <div class="notif-dropdown-head">
                                <span>Notifications</span>
                                <button class="notif-mark-read-btn" id="notifMarkReadBtn">Mark all read</button>
                            </div>
                            <div id="notifList"><div class="notif-empty">Loading...</div></div>
                        </div>
                    </div>
                </div>
            </header>

            <main class="dashboard-content">

                <div class="form-card">

                    <div class="form-error-banner" id="form-error" style="display:none;"></div>
                    <div class="form-success-banner" id="form-success" style="display:none;"></div>

                    <form id="post-food-items-form" novalidate>

                        <div class="dash-form-group">
                            <label for="foodName">Food Name</label>
                            <input type="text" id="foodName" class="dash-input" placeholder="e.g. Jollof Rice, Egusi Soup">
                            <div class="dash-field-error" id="foodName-error"></div>
                        </div>

                        <div class="dash-form-group">
                            <label for="foodDescription">Description</label>
                            <textarea id="foodDescription" class="dash-input dash-textarea" placeholder="e.g. Jollof rice with chicken, made this morning. Contains groundnut oil. Best enjoyed reheated." rows="3" minlength="20"></textarea>
                            <div class="dash-field-error" id="foodDescription-error"></div>
                        </div>

                        <div class="dash-form-row">
                            <div class="dash-form-group">
                                <label for="foodType">Food Type</label>
                                <select id="foodType" class="dash-input">
                                    <option value="">Select type</option>
                                    <option value="1">Freshly Cooked Meal</option>
                                    <option value="2">Baked Goods</option>
                                    <option value="3">Raw Produce</option>
                                    <option value="4">Packaged or Processed</option>
                                </select>
                                <div class="dash-field-error" id="foodType-error"></div>
                            </div>
                            <div class="dash-form-group">
                                <label for="storageInstruction">Storage / Serving</label>
                                <select id="storageInstruction" class="dash-input">
                                    <option value="">Select instruction</option>
                                    <option value="1">Room Temperature</option>
                                    <option value="2">Refrigerated</option>
                                    <option value="3">Must Be Reheated Before Eating</option>
                                </select>
                                <div class="dash-field-error" id="storageInstruction-error"></div>
                            </div>
                        </div>

                        <div class="dash-form-group">
                            <label for="bestBeforeDate">Best Before</label>
                            <input type="datetime-local" id="bestBeforeDate" class="dash-input">
                            <div class="dash-field-error" id="bestBeforeDate-error"></div>
                        </div>

                        <div class="dash-form-group">
                            <label>Allergens (check all that apply)</label>
                            <div class="toggle-row" style="flex-wrap:wrap;">
                                <label class="allergen-check"><input type="checkbox" value="Nuts"> Nuts</label>
                                <label class="allergen-check"><input type="checkbox" value="Dairy"> Dairy</label>
                                <label class="allergen-check"><input type="checkbox" value="Gluten"> Gluten</label>
                                <label class="allergen-check"><input type="checkbox" value="Egg"> Egg</label>
                                <label class="allergen-check"><input type="checkbox" value="Seafood"> Seafood</label>
                                <label class="allergen-check"><input type="checkbox" value="Soy"> Soy</label>
                            </div>
                        </div>

                        <div class="dash-form-row">
                            <div class="dash-form-group">
                                <label for="quantity">Total Quantity (portions)</label>
                                <input type="number" id="quantity" class="dash-input" placeholder="e.g. 2" min="1">
                                <div class="dash-field-error" id="quantity-error"></div>
                            </div>
                            <div class="dash-form-group">
                                <label for="quantityPerUnit">Servings Per Portion</label>
                                <input type="number" id="quantityPerUnit" class="dash-input" placeholder="e.g. 1" min="1">
                                <div class="dash-field-error" id="quantityPerUnit-error"></div>
                            </div>
                        </div>

                        <div class="dash-form-group">
                            <label>Free Or Discounted?</label>
                            <div class="toggle-row">
                                <button type="button" class="toggle-opt" id="free-yes" data-value="true">
                                    Yes - Free
                                </button>
                                <button type="button" class="toggle-opt" id="free-no" data-value="false">
                                    No - Set a Price
                                </button>
                            </div>
                        </div>

                        <div class="dash-form-group" id="price-group" style="display:none;">
                            <label for="price">Price (₦)</label>
                            <input type="number" id="price" class="dash-input" placeholder="e.g. 500" min="1">
                            <div class="dash-field-error" id="price-error"></div>
                        </div>

                        <div class="dash-form-group">
                            <label>Is pickup available?</label>
                            <div class="toggle-row">
                                <button type="button" class="toggle-opt" id="pickup-yes" data-value="true">Yes</button>
                                <button type="button" class="toggle-opt" id="pickup-no" data-value="false">No</button>
                            </div>
                        </div>

                        <div id="pickup-window-group">
                            <div class="dash-form-row">
                                <div class="dash-form-group">
                                    <label for="pickUpStart">Pickup Start</label>
                                    <input type="datetime-local" id="pickUpStart" class="dash-input">
                                    <div class="dash-field-error" id="pickUpStart-error"></div>
                                </div>
                                <div class="dash-form-group">
                                    <label for="pickUpEnd">Pickup End</label>
                                    <input type="datetime-local" id="pickUpEnd" class="dash-input">
                                    <div class="dash-field-error" id="pickUpEnd-error"></div>
                                </div>
                            </div>
                        </div>

                        <div class="dash-form-group">
                            <label>Is delivery available?</label>
                            <div class="toggle-row">
                                <button type="button" class="toggle-opt" id="delivery-yes" data-value="true">Yes</button>
                                <button type="button" class="toggle-opt" id="delivery-no" data-value="false">No</button>
                            </div>
                        </div>

                        <div class="dash-form-group" id="saved-location-group" style="display:none;">
                            <label for="savedLocationSelect">Use a Saved Location</label>
                            <select id="savedLocationSelect" class="dash-input">
                                <option value="">Type a new address</option>
                            </select>
                        </div>

                        <div class="dash-form-group">
                            <label for="itemAddress">Food Location</label>
                            <input type="text" id="itemAddress" class="dash-input" placeholder="e.g. 5 Marina Road, Lagos Island">
                            <div class="dash-field-error" id="itemAddress-error"></div>
                        </div>

                        <div class="dash-form-group">
                            <label for="images">Upload Images (max 5, jpg/png/webp, max 5MB each)</label>
                            <div class="image-upload-area" id="image-upload-area">
                                <input type="file" id="images" accept=".jpg,.jpeg,.png,.webp" multiple style="display:none;">
                                <p>Click to upload image</p>
                                <span>JPG, PNG, WEBP up to 5MB</span>
                            </div>
                            <div class="image-previews" id="image-previews"></div>
                            <div class="dash-field-error" id="images-error"></div>
                        </div>

                        <div class="dash-form-group">
                            <label style="display:flex;align-items:flex-start;gap:8px;font-weight:400;">
                                <input type="checkbox" id="attestationCheck" style="margin-top:3px;">
                                <span>I confirm this description accurately reflects the food's actual condition.</span>
                            </label>
                            <div class="dash-field-error" id="attestation-error"></div>
                        </div>

                        <button type="submit" class="btn-submit-listing" id="submit-btn">
                            <span id="btn-text">Post Food Items</span>
                            <span class="spinner" id="btn-spinner"></span>
                        </button>

                    </form>

                </div>

            </main>
        </div>
    </div>

    <script src="utils.js"></script>
    <script src="api.js"></script>
    <script src="signalr.js"></script>
    <script src="notif-bell.js"></script>
    <script src="post-food-items.js"></script>
</body>
</html>
