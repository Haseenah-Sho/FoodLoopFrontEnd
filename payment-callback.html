<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - FoodLoop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
    <style>
        body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--surface); }
        .callback-card {
            background:var(--white); border-radius:var(--radius); box-shadow:var(--card-shadow);
            border:2px solid var(--border); padding:40px 36px; max-width:400px; width:90%; text-align:center;
        }
        .callback-icon { font-size:3rem; margin-bottom:16px; }
        .callback-icon.success { color:var(--primary); }
        .callback-icon.error { color:#c62828; }
        .callback-title { font-size:1.15rem; font-weight:800; color:var(--dark); margin-bottom:8px; }
        .callback-message { font-size:0.88rem; color:var(--dark-muted); margin-bottom:24px; }
        .callback-spinner {
            width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--primary);
            border-radius:50%; margin:0 auto 20px; animation:spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>
<body>

    <div class="callback-card" id="callback-card">
        <div class="callback-spinner" id="callback-spinner"></div>
        <div class="callback-title" id="callback-title">Confirming your payment...</div>
        <div class="callback-message" id="callback-message">Please wait, this only takes a moment.</div>
        <a href="customer-dashboard.html" class="btn-primary-sm" id="callback-btn" style="display:none;">Go to Dashboard</a>
    </div>

    <script src="utils.js"></script>
    <script src="api.js"></script>
    <script src="payment-callback.js"></script>
</body>
</html>
