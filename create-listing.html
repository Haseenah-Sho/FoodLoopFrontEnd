<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Listing - FoodLoop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <div class="dashboard-container">

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <a href="index.html" class="sidebar-logo">Food<span>Loop</span></a>
                <button class="sidebar-close" id="sidebarClose">
                    <i class="bi bi-x"></i>
                </button>
            </div>
            <div class="sidebar-user">
                <div class="sidebar-user-info">
                    <div class="sidebar-username" id="sidebar-username">Loading...</div>
                    <div class="sidebar-role">Vendor / Household</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="vendor-dashboard.html" class="sidebar-link">Dashboard</a>
                <a href="my-listings.html" class="sidebar-link">My Listings</a>
                <a href="create-listing.html" class="sidebar-link active">Create Listing</a>
                <a href="vendor-orders.html" class="sidebar-link">Orders</a>
                <a href="vendor-transactions.html" class="sidebar-link">Transactions</a>
                <a href="vendor-profile.html" class="sidebar-link">Profile</a>
            </nav>
            <div class="sidebar-bottom">
                <button class="sidebar-logout" onclick="Auth.logout()">Logout</button>
            </div>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <div class="dashboard-main">
            <header class="topbar">
                <button class="topbar-toggle" id="sidebarToggle">
                    <i class="bi bi-list"></i>
                </button>
                <div class="topbar-title">Create Listing</div>
            </header>

            <main class="dashboard-content">

                <div class="form-card">

                    <div class="form-error-banner" id="form-error" style="display:none;"></div>
                    <div class="form-success-banner" id="form-success" style="display:none;"></div>

                    <form id="create-listing-form" novalidate>

                        <div class="dash-form-group">
                            <label for="foodName">Food Name</label>
                            <input type="text" id="foodName" class="dash-input" placeholder="e.g. Jollof Rice, Egusi Soup">
                            <div class="dash-field-error" id="foodName-error"></div>
                        </div>

                        <div class="dash-form-group">
                            <label for="foodDescription">Description</label>
                            <textarea id="foodDescription" class="dash-input dash-textarea" placeholder="Describe the food - ingredients, serving size, condition, and so on." rows="3"></textarea>
                            <div class="dash-field-error" id="foodDescription-error"></div>
                        </div>

                        <div class="dash-form-row">
                            <div class="dash-form-group">
                                <label for="quantity">Total Quantity (portions)</label>
                                <input type="number" id="quantity" class="dash-input" placeholder="e.g. 2" min="1">
                                <div class="dash-field-error" id="quantity-error"></div>
                            </div>
                            <div class="dash-form-group">
                                <label for="quantityPerUnit">Servings Per Portion</label>
                                <input type="number" id="quantityPerUnit" class="dash-input" placeholder="e.g. 1" min="1">
                                <div class="dash-field-error" id="quantityPerUnit-error"></div>
                            </div>
                        </div>

                        <div class="dash-form-group">
                            <label>Free Or Discounted?</label>
                            <div class="toggle-row">
                                <button type="button" class="toggle-opt" id="free-yes" data-value="true">
                                    Yes - Free
                                </button>
                                <button type="button" class="toggle-opt" id="free-no" data-value="false">
                                    No - Set a Price
                                </button>
                            </div>
                        </div>

                        <div class="dash-form-group" id="price-group" style="display:none;">
                            <label for="price">Price (₦)</label>
                            <input type="number" id="price" class="dash-input" placeholder="e.g. 500" min="1">
                            <div class="dash-field-error" id="price-error"></div>
                        </div>

                        <div class="dash-form-group">
                            <label>Is pickup available?</label>
                            <div class="toggle-row">
                                <button type="button" class="toggle-opt" id="pickup-yes" data-value="true">Yes</button>
                                <button type="button" class="toggle-opt" id="pickup-no" data-value="false">No</button>
                            </div>
                        </div>

                        <div id="pickup-window-group">
                            <div class="dash-form-row">
                                <div class="dash-form-group">
                                    <label for="pickUpStart">Pickup Start</label>
                                    <input type="datetime-local" id="pickUpStart" class="dash-input">
                                    <div class="dash-field-error" id="pickUpStart-error"></div>
                                </div>
                                <div class="dash-form-group">
                                    <label for="pickUpEnd">Pickup End</label>
                                    <input type="datetime-local" id="pickUpEnd" class="dash-input">
                                    <div class="dash-field-error" id="pickUpEnd-error"></div>
                                </div>
                            </div>
                        </div>

                        <div class="dash-form-group">
                            <label>Is delivery available?</label>
                            <div class="toggle-row">
                                <button type="button" class="toggle-opt" id="delivery-yes" data-value="true">Yes</button>
                                <button type="button" class="toggle-opt active" id="delivery-no" data-value="false">No</button>
                            </div>
                        </div>

                        <div class="dash-form-group" id="delivery-fee-group" style="display:none;">
                            <label for="deliveryFee">Delivery Fee (₦) - enter 0 for free delivery</label>
                            <input type="number" id="deliveryFee" class="dash-input" placeholder="e.g. 500" min="0">
                            <div class="dash-field-error" id="deliveryFee-error"></div>
                        </div>


                        <div class="dash-form-group">
                            <label for="images">Upload Images (max 5, jpg/png/webp, max 5MB each)</label>
                            <div class="image-upload-area" id="image-upload-area">
                                <input type="file" id="images" accept=".jpg,.jpeg,.png,.webp" multiple style="display:none;">
                                <p>Click to upload image</p>
                                <span>JPG, PNG, WEBP up to 5MB</span>
                            </div>
                            <div class="image-previews" id="image-previews"></div>
                            <div class="dash-field-error" id="images-error"></div>
                        </div>

                        <button type="submit" class="btn-submit-listing" id="submit-btn">
                            <span id="btn-text">Create Listing</span>
                            <span class="spinner" id="btn-spinner"></span>
                        </button>

                    </form>

                </div>

            </main>
        </div>
    </div>

    <script src="utils.js"></script>
    <script src="api.js"></script>
    <script src="create-listing.js"></script>
</body>
</html>
