<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listings — FoodLoop Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <div class="dashboard-wrapper">

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <a href="index.html" class="sidebar-logo">Food<span>Loop</span></a>
                <button class="sidebar-close" id="sidebarClose">
                    <i class="bi bi-x"></i>
                </button>
            </div>
            <div class="sidebar-user">
                <div class="sidebar-avatar" id="sidebar-avatar"></div>
                <div class="sidebar-user-info">
                    <div class="sidebar-username" id="sidebar-username">Loading...</div>
                    <div class="sidebar-role">Admin</div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="admin-dashboard.html" class="sidebar-link">Dashboard</a>
                <a href="admin-vendors.html" class="sidebar-link">Vendors / Households</a>
                <a href="admin-customers.html" class="sidebar-link">Customers</a>
                <a href="admin-listings.html" class="sidebar-link active">Listings</a>
            </nav>
            <div class="sidebar-bottom">
                <button class="sidebar-logout" onclick="Auth.logout()">Logout</button>
            </div>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <div class="dashboard-main">
            <header class="topbar">
                <button class="topbar-toggle" id="sidebarToggle">
                    <i class="bi bi-list"></i>
                </button>
                <div class="topbar-title">Listings</div>
            </header>

            <main class="dashboard-content">

                <div class="filter-tabs">
                    <button class="filter-tab active" data-filter="all">All</button>
                    <button class="filter-tab" data-filter="Active">Active</button>
                    <button class="filter-tab" data-filter="Completed">Completed</button>
                    <button class="filter-tab" data-filter="Expired">Expired</button>
                </div>

                <div class="section">
                    <div id="listings-container">
                        
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="utils.js"></script>
    <script src="api.js"></script>
    <script src="admin-listings.js"></script>
</body>
</html>
